name: Fantasy test
on:
  workflow_dispatch:
    inputs:
      stage: {description: "img или vid", required: true}
      which: {description: "для vid: номера картинок через запятую", required: false, default: "0,1"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          python3 tools/fantasy_test.py ${{ inputs.stage }} ${{ inputs.which }}
      - name: Commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research && git commit -m "Fantasy test" && git pull --rebase && git push
