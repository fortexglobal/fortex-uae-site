name: Instagram publish
# Лёгкая публикация по расписанию: каждые 15 минут выпускаем всё, у чего наступило publish_at.
# Рендер остаётся в workflow Instagram; здесь только публикация уже готовых файлов.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          python3 tools/ig.py
      - name: Commit status
        run: |
          git add ig
          git diff --cached --quiet || (git commit -m "Instagram status" && git pull --rebase --autostash && git push)
