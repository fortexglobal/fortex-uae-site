name: Instagram publish
# Лёгкая публикация по расписанию: каждые 15 минут выпускаем всё, у чего наступило publish_at.
# Рендер остаётся в workflow Instagram; здесь только публикация уже готовых файлов.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          python3 tools/ig.py
      - name: Commit status
        run: |
          git add ig
          git diff --cached --quiet && exit 0
          git commit -m "Instagram status"
          for i in 1 2 3 4 5; do  # смотритель и другие задачи пушат в то же время: повторяем
            git pull --rebase --autostash -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 7))
          done
          exit 1
