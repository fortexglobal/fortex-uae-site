name: Site screenshots
# Скриншоты чужого сайта для разбора дизайна: research/<name>/s*.png (десктоп) и m*.png (телефон), плюс html и css.
on:
  workflow_dispatch:
    inputs:
      url: {required: true}
      name: {required: true}
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Shots
        env: {URL: "${{ inputs.url }}", NAME: "${{ inputs.name }}"}
        run: |
          npm i -s playwright@1.47.2 && npx playwright install --with-deps chromium >/dev/null
          mkdir -p research/$NAME
          cat > /tmp/s.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const d='research/'+process.env.NAME;
          for (const [pre,w,h] of [['s',1440,900],['m',390,844]]){
            const p=await b.newPage({viewport:{width:w,height:h}});
            await p.goto(process.env.URL,{waitUntil:'networkidle',timeout:90000}).catch(e=>console.log(e.message));
            await p.waitForTimeout(4000);
            const H=await p.evaluate(()=>document.documentElement.scrollHeight);
            for(let y=0;y<H;y+=h*0.6){await p.evaluate(v=>window.scrollTo(0,v),y);await p.waitForTimeout(400);}
            const n=Math.min(14,Math.ceil(H/h));
            for(let i=0;i<n;i++){await p.evaluate(v=>window.scrollTo(0,v),i*h);await p.waitForTimeout(1200);await p.screenshot({path:`${d}/${pre}${String(i).padStart(2,'0')}.png`});}
            if(pre==='s'){require('fs').writeFileSync(d+'/page.html',await p.content());
              const css=await p.evaluate(()=>[...document.styleSheets].map(s=>{try{return [...s.cssRules].map(r=>r.cssText).join('\n')}catch(e){return ''}}).join('\n'));
              require('fs').writeFileSync(d+'/styles.css',css);}
            await p.close();}
          await b.close();})();
          JS
          node /tmp/s.js
      - name: Commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research && git commit -qm "Site screenshots" && git pull -q --rebase && git push -q
