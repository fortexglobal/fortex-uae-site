name: Site screenshots
# Скриншоты чужого сайта для разбора дизайна: research/<name>/s*.png (десктоп) и m*.png (телефон), плюс html и css.
on:
  workflow_dispatch:
    inputs:
      url: {required: true}
      name: {required: true}
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Shots
        env: {URL: "${{ inputs.url }}", NAME: "${{ inputs.name }}"}
        run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
          python3 tools/site_shot.py "$URL" "$NAME"
      - name: Commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research && git commit -qm "Site screenshots" && git pull -q --rebase && git push -q
