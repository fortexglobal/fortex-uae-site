name: Fetch media
# Скачивает медиа для монтажа (Buzzy, сток) в research/fetch/<name>/ по файлу research/fetch/<name>.json
on:
  push:
    paths: ["research/fetch/*.json"]
permissions:
  contents: write
concurrency: fetch-media
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          pip install -q pillow
          python3 tools/fetch_media.py
      - name: Commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/fetch
          git diff --cached --quiet || (git commit -m "Fetch media" && git pull --rebase --autostash && git push)
