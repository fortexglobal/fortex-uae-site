name: Post covers
on:
  push:
    paths: ["covers/requests/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: covers
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Generate backgrounds and render covers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 tools/cover_job.py
      - name: Commit
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add covers static/covers || true
          git diff --cached --quiet || (git commit -m "Post covers" && git pull --rebase && git push)
