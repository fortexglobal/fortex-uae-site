name: Alexey sim
on:
  workflow_dispatch:
  push:
    paths: ["tools/sim/request.json"]
permissions:
  contents: write
concurrency: alexey-sim
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install httpx
      - name: Run simulation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 tools/sim/alexey_sim.py
      - name: Commit
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add sim
          git diff --cached --quiet || (git commit -m "Alexey sim results" && git pull --rebase && git push)
