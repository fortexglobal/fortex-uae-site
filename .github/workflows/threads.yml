name: Threads
on:
  push:
    paths: ["threads/src/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"     # публикация: каждый час проверяем, что пора выпускать
    - cron: "33 3 * * *"     # поиск клиентов: 07:33 по Дубаю
    - cron: "11 2 1 * *"     # продление токена раз в месяц
permissions:
  contents: write
concurrency: threads
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py check 2>&1 | tee threads/check.log
      - name: Probe
        if: hashFiles('threads/probe.json') != ''
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py probe && rm threads/probe.json
      - name: Publish
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py publish
      - name: Search
        if: github.event.schedule == '33 3 * * *' || github.event_name != 'schedule'
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py search 2>&1 | tee threads/search.log
      - name: Refresh token
        if: github.event.schedule == '11 2 1 * *'
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py refresh
      - name: Commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add threads
          git diff --cached --quiet || (git commit -m "Threads status" && git pull --rebase --autostash && git push)
