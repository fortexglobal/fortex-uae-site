name: Threads
on:
  push:
    paths: ["threads/src/**", "threads/stats/refresh"]
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"     # публикация: каждые 15 минут проверяем, что пора выпускать
    - cron: "33 3 * * *"     # поиск клиентов: 07:33 по Дубаю
    - cron: "11 2 1 * *"     # продление токена раз в месяц
permissions:
  contents: write
concurrency: threads
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}  # свежий main, а не снимок на момент запуска: иначе второй запуск в очереди публиковал повтор
      - name: Check token
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py check 2>&1 | tee threads/check.log
      - name: Probe
        if: hashFiles('threads/probe.json') != ''
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py probe && rm threads/probe.json
      - name: Dedupe
        if: hashFiles('threads/dedupe.request') != ''
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py dedupe && rm threads/dedupe.request
      - name: Publish
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py publish
      - name: Reply to comments
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 tools/threads.py replies
      - name: Insights
        if: github.event.schedule == '33 3 * * *' || github.event_name != 'schedule'
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py insights
      - name: Search
        if: github.event.schedule == '33 3 * * *' || github.event_name != 'schedule'
        continue-on-error: true
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py search 2>&1 | tee threads/search.log
      - name: Refresh token
        if: github.event.schedule == '11 2 1 * *'
        env: { THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}" }
        run: python3 tools/threads.py refresh
      - name: Commit
        run: bash tools/threads_commit.sh
