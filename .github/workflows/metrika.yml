name: Metrika weekly stats
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stats
        env:
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
        run: python3 tools/metrika.py
      - name: Commit
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add stats
          git diff --cached --quiet || (git commit -m "Metrika weekly stats" && git pull --rebase && git push)
