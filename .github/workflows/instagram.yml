name: Instagram
on:
  push:
    paths: ["ig/src/**", "ig/reels/src/**"]
  workflow_dispatch:
  schedule:
    - cron: "7 15 * * *"
permissions:
  contents: write
concurrency:
  group: instagram
  cancel-in-progress: true
jobs:
  ig:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
      - name: Render slides
        timeout-minutes: 20
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 tools/ig_render.py
          python3 tools/reel_render.py
      - name: Render reels v2
        timeout-minutes: 45
        continue-on-error: true
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 tools/reel_v2.py
      - name: Commit slides
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add ig
          git diff --cached --quiet || (git commit -m "Instagram slides" && git pull --rebase --autostash && git push)
      - name: Publish approved
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 tools/ig.py
      - name: Commit status
        run: |
          git add ig
          git diff --cached --quiet || (git commit -m "Instagram status" && git pull --rebase --autostash && git push)
