[build]
  # собираем только если поменялся сам сайт (экономим кредиты Netlify)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- build.py content static netlify netlify.toml"
  command = "python3 build.py"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru; frame-src https://mc.yandex.ru https://mc.yandex.com https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' https:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[redirects]]
  from = "/ig"
  to = "https://t.me/Fortex_Dubai?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%21%20%D0%9F%D0%B8%D1%88%D1%83%20%D0%B8%D0%B7%20Instagram."
  status = 302
  force = true

[[redirects]]
  from = "/th"
  to = "https://t.me/Fortex_Dubai?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%21%20%D0%9F%D0%B8%D1%88%D1%83%20%D0%B8%D0%B7%20Threads."
  status = 302
  force = true
